name: Build and Release - ver .exe

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # нужно для создания релизов/тегов

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # чтобы видеть теги/историю

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3"

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction

      # Делаем однострочник на PowerShell.
      - name: Print Python & SSL info
        run: >
          python -c "import ssl, sys; print('Python:', sys.version);
          print('SSL   :', getattr(ssl, 'OPENSSL_VERSION', 'unknown'))"


      # Проверка зависимостей на конфликты
      - name: pip check
        run: poetry run pip check

      # Снимок списка пакетов в артефакт (на будущее)
      - name: Export dependency snapshot
        run: poetry run pip freeze > pip-freeze.txt

      - name: Get application version
        id: get_version
        shell: pwsh
        run: |
          $appVersion = (Get-Content src/pdf_ocr_app/version.py | Select-String '__version__ = "(.*)"').Matches.Groups[1].Value
          $projectVersion = (poetry version --short).Trim()
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")

          if ($appVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match src/pdf_ocr_app/version.py $appVersion"
          }
          if ($projectVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match pyproject.toml $projectVersion"
          }

          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Build .exe with PyInstaller (no strip)
        run: |
          poetry run pyinstaller --onefile --noconsole --clean --name ContainerScan --icon icon.ico --add-data "icon.ico;." --paths src --hidden-import=_ssl --collect-all=certifi run.py

        # Пояснение:
        # --hidden-import=_ssl   → страхуем явное включение SSL-модуля
        # --collect-data certifi → берём корневые сертификаты (cacert.pem) в бандл

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            dist/ContainerScan.exe
            pip-freeze.txt

      - name: Create GitHub Release
        id: create_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $release_tag = "v$version"
          gh release create $release_tag dist/ContainerScan.exe --title "Release $release_tag" --notes "Release notes for $release_tag"

      - name: Create GitHub Release in another repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # личный PAT с правами на repo vanitoo/pythonProject-OpenCV-PDF-Build
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          $release_tag = "v$version"
          gh release create $release_tag dist/ContainerScan.exe `
            --repo vanitoo/pythonProject-OpenCV-PDF-Build `
            --title "Release $release_tag" `
            --notes "Release notes for $release_tag" `
            --generate-notes
