name: Build Python 3.10 Application2


on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Установка Python 3.10 (рекомендуемая стабильная версия для PyInstaller)
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        architecture: 'x64'

    - name: Get version from version.py
      id: get_version
      run: |
        python -c "from version import __version__; print(f'version={__version__}')" >> $env:GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==5.13.2  # Специально стабильная версия

    - name: Install build tools
      run: |
        choco install mingw -y
        refreshenv
        gcc --version  # Проверка установки MinGW

    # Сборка с явным указанием путей и параметров
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --clean ^
          --add-binary "$(python -c 'import sys; print(sys.base_prefix)')/python310.dll;." ^
          --paths "$(python -c 'import sys; print(sys.path[-1])')" ^
          --runtime-tmpdir . ^
          --name "PDFContainerScanner" ^
          main.py

    # Проверка наличия DLL в собранном EXE
    - name: Verify build
      run: |
        if not exist "dist/PDFContainerScanner.exe" (
          echo "Build failed - EXE not found"
          exit 1
        )
        echo "Build successful"

    # Создание релиза с версией из version.py
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: "PDF Container Scanner v${{ steps.get_version.outputs.version }}"
        body: "Automated build for version ${{ steps.get_version.outputs.version }}"
        files: |
          dist/PDFContainerScanner.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Дополнительная публикация в другом репозитории
    - name: Publish to Secondary Repo
      if: success()
      run: |
        gh release create "v${{ steps.get_version.outputs.version }}" ^
          --repo your-username/your-repo-name ^
          --title "PDF Scanner v${{ steps.get_version.outputs.version }}" ^
          --notes "Automated build" ^
          dist/PDFContainerScanner.exe
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: Code signing
      if: success()
      run: |
        signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /a dist/PDFContainerScanner.exe        
          
    - name: Strip binaries
      run: |
        strip dist/PDFContainerScanner.exe
