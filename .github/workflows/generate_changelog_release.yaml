name: Generate Changelog Release

on:
  push:
    branches:
      - master
  release:
    types: [created]

permissions:
  contents: write  # нужно для коммита/пуша в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Генерация CHANGELOG.md без Docker/apt (новая версия экшена)
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4.5.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      # Коммитим изменения только если файл реально обновился
      - name: Commit & Push Changelog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Проверяем, есть ли изменения
          if git diff --quiet -- CHANGELOG.md; then
            echo "Изменений в CHANGELOG.md нет — пропускаем коммит."
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md [skip ci]"
          git push origin HEAD:master
