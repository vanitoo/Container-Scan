# .github/workflows/pip-audit.yml
# Экшен упадёт, если найдёт уязвимости — удобно для блокировки небезопасных PR

name: pip-audit

on:
  pull_request:
    paths: ["pyproject.toml", "poetry.lock"]
  push:
    branches: [master]
    paths: ["pyproject.toml", "poetry.lock", ".github/workflows/pip-audit.yml"]

permissions:
  contents: write
  pull-requests: read
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install "poetry>=2.0,<3"
      - name: Refresh vulnerable transitive dependencies
        run: poetry update idna urllib3 --lock --no-interaction
      - name: Install locked dependencies
        run: poetry install --with dev --no-root --no-interaction
      - name: Commit refreshed lock file
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if ! git diff --quiet -- poetry.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add poetry.lock
            git commit -m "chore: refresh audited dependencies"
            git push
          fi
      - name: Audit installed dependencies
        run: poetry run pip-audit
