# .github/workflows/pip-audit.yml
# Экшен упадёт, если найдёт уязвимости — удобно для блокировки небезопасных PR

name: pip-audit

on:
  pull_request:
    paths: ["requirements*.txt", "pyproject.toml", "poetry.lock"]

# Минимальные права согласно принципу least privilege
permissions:
  contents: read  # только чтение кода
  pull-requests: read  # только чтение PR
  checks: write  # запись результатов проверки

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pypa/gh-action-pip-audit@v1.2.0
        with:
          inputs: "requirements.txt"   # или auto-detect для lock-файлов