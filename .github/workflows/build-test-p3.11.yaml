name: Build Python 3.11 Application2


on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'PDFContainerScanner'

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Подготовка окружения
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        architecture: x64

    - name: Get version
      id: version
      run: |
        python -c "from version import __version__; print(f'version={__version__}')" >> $env:GITHUB_OUTPUT

    # 2. Установка зависимостей
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.2.0  # Последняя версия для Python 3.11

    # 3. Установка инструментов сборки
    - name: Install build tools
      run: |
        choco install mingw -y
        choco install upx -y
        refreshenv

    # 4. Сборка приложения
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --clean `
          --name $env:APP_NAME `
          --add-data "$(python -c 'import sys; print(sys.base_prefix)')/python311.dll;." `
          --paths "$(python -c 'import sys; print(sys.path[-1])')" `
          --runtime-tmpdir . `
          --upx-dir "C:\ProgramData\chocolatey\lib\upx\tools" `
          main.py

    # 5. Подпись кода (опционально)
    - name: Code signing
      if: success() && github.ref == 'refs/heads/master'
      run: |
        signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /a "dist\$env:APP_NAME.exe"
      env:
        SIGNTOOL_PASSWORD: ${{ secrets.SIGNTOOL_PASSWORD }}

    # 6. Оптимизация бинарника
    - name: Optimize binary
      run: |
        strip --strip-all "dist\$env:APP_NAME.exe"
        upx --best --lzma "dist\$env:APP_NAME.exe"

    # 7. Проверка результата
    - name: Verify build
      run: |
        if (-not (Test-Path "dist\$env:APP_NAME.exe")) {
          Write-Error "Build failed - EXE not found"
          exit 1
        }
        $size = (Get-Item "dist\$env:APP_NAME.exe").Length/1MB
        Write-Host "Build successful. File size: $($size.ToString('0.00')) MB"

    # 8. Создание релиза
    - name: Create Release
      if: success() && github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: "${{ env.APP_NAME }} v${{ steps.version.outputs.version }}"
        body: "Auto-built Python ${{ env.PYTHON_VERSION }} application"
        files: |
          dist/${{ env.APP_NAME }}.exe
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

