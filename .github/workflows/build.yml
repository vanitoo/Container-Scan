name: Build and Release .exe

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest  # Важный момент: используем Windows для сборки .exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller  # Устанавливаем PyInstaller

    - name: Build .exe with PyInstaller
      run: |
        pyinstaller --onefile --windowed --clean --strip main.py

    - name: Upload .exe artifact
      uses: actions/upload-artifact@v3
      with:
        name: main.exe  # Название артефакта
        path: dist/main.exe  # Путь к скомпилированному .exe файлу




    - name: Create GitHub Release
      id: create_release
      run: |
        #$RELEASE_TAG = git describe --tags --abbrev=0 2>$null
        $RELEASE_TAG = "v" + (Get-Date -Format "yyyyMMddHHmmss")
        if ($RELEASE_TAG) {
            Write-Host "Existing tag found: $RELEASE_TAG"
        } else {
            Write-Host "No existing tag found. Creating a new tag."
            $RELEASE_TAG = "v1.0.0"
            git tag $RELEASE_TAG
            git push origin $RELEASE_TAG --force
        }
        gh release create $RELEASE_TAG dist/main.exe --title "Release $RELEASE_TAG" --notes "Release notes for $RELEASE_TAG"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
