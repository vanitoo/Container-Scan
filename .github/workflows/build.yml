name: Build and Release .exe

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest  # Важный момент: используем Windows для сборки .exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller  # Устанавливаем PyInstaller

    - name: Build .exe with PyInstaller
      run: |
        pyinstaller --onefile --windowed --clean --strip main.py

    - name: Upload .exe artifact
      uses: actions/upload-artifact@v3
      with:
        name: main.exe  # Название артефакта
        path: dist/main.exe  # Путь к скомпилированному .exe файлу




    - name: Create GitHub Release
      id: create_release
      run: |
        if (git describe --tags --abbrev=0 2>/dev/null) {
          RELEASE_TAG=$(git describe --tags --abbrev=0)
        } else {
          # Создаем новый тег, если тегов нет (используем простую схему версий)
          RELEASE_TAG="v1.0.0"
          git tag $RELEASE_TAG
          git push origin $RELEASE_TAG
        }
        gh release create $RELEASE_TAG dist/main.exe --title "Release $RELEASE_TAG" --notes "Release notes for $RELEASE_TAG"
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

