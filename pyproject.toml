[project]
name = "OpenCV-PFD"
version = "1.2.1"
description = "Распознавание текста из PDF"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.ruff]
line-length = 120
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules
  "UP",  # pyupgrade
]
ignore = [
  "B904",
  "EM101",
  "RUF100",
]

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["F401", "F841"]


[tool.ruff.format]
indent-style = "space"  # Использовать пробелы вместо табов
quote-style = "double"  # Двойные кавычки (перенесено сюда!)


[tool.ruff.isort]
known-first-party = ["opencv_pdf"]
required-imports = ["from __future__ import annotations"]


[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]

