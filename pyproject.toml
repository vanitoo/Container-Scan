[project]
name = "pythonProject-OpenCV-PDF"
description = "Распознавание текста из PDF"
authors = [{name = "Vanitoo", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dynamic = ["version"]


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "version.__version__"}


[tool.ruff]
line-length = 120

# Настройки линтинга
[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules
  "UP"   # pyupgrade
]
ignore = [
  "B904", "EM101", "RUF100", "RUF003", "RUF001", "RUF002"
]
fixable = ["ALL"]
unfixable = ["F401", "F841"]
extend-ignore = ["RUF001"]  # Игнорировать проверку кириллицы в строках

# Настройки isort теперь внутри lint
[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

# Настройки форматирования
[tool.ruff.format]
indent-style = "space"  # Использовать пробелы вместо табов
quote-style = "double"  # Двойные кавычки

# Игнорирование по файлам
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]