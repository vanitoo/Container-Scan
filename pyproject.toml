[project]
name = "OpenCV-PFD"
version = "1.2.1"
description = "Распознавание текста из PDF"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.ruff]
# Включаем все основные правила
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "EM",  # flake8-errmsg
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules
  "UP",  # pyupgrade
  "YTT", # flake8-2020
]

# Игнорируем некоторые конкретные правила
ignore = [
  "E501",  # Длина строки - будем обрабатывать отдельно
  "B904",  # Требует явного raise from для исключений в блоках try/except
  "EM101", # Слишком длинные сообщения об ошибках
  "RUF100", # Неиспользуемые noqa
]

# Настройки для конкретных правил
[tool.ruff.isort]
known-first-party = ["your_package_name"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.per-file-ignores]
# Пример игнорирования правил для конкретных файлов
"__init__.py" = ["F401"]  # Неиспользуемый импорт в __init__.py
"tests/**" = ["S101"]     # Игнорируем проверки на использование assert в тестах

[tool.ruff.lint]
# Максимальная длина строки
line-length = 120

# Автоматическое исправление некоторых проблем
fixable = ["ALL"]
unfixable = ["F401", "F841"]

[tool.ruff.format]
# Настройки форматирования (если используем ruff format)
quote-style = "double"
indent-width = 4
