[project]
name = "pythonproject-opencv-pdf"
version = "2.0.5"
description = "Распознавание текста из PDF"
authors = [
    {name = "vanitoo",email = "56897888+vanitoo@users.noreply.github.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "opencv-python (>=4.10.0,<4.11.0)",
    "pymupdf (>=1.24.10,<1.27.0)",
    "openpyxl (>=3.1.5,<3.2.0)",
    "pytesseract (>=0.3.11,<0.4.0)",
    "requests (>=2.32.3,<2.33.0)",
    "python-dotenv (>=1.0.1,<1.3.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "numpy (>=1.26.4,<2.4.0)",
    "pillow (>=10.3.0,<10.4.0)",
    "sv-ttk (>=2.6,<3.0)"
]

[dependency-groups]
dev = [
    "bandit (>=1.8,<2.0)",
    "pip-audit (>=2.9,<3.0)",
    "pyinstaller (>=6.3,<7.0)",
    "pytest (>=8.0,<10.0)",
    "ruff (>=0.11,<1.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "C4", "EM", "SIM", "PTH", "RUF", "UP"
]
ignore = ["B904", "EM101", "RUF100", "RUF003", "RUF001", "RUF002"]
fixable = ["ALL"]
unfixable = ["F401", "F841"]
extend-ignore = ["RUF001"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101"]
